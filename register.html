<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kisan Sarthi - Create Account</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;900&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#63cf17",
            "background-light": "#f7f8f6",
            "background-dark": "#182111",
            "content-light": "#141811",
            "content-dark": "#f7f8f6",
            "subtle-light": "#728863",
            "subtle-dark": "#a0b892",
            "border-light": "#e0e5dc",
            "border-dark": "#2c3b21"
          },
          fontFamily: { display: ["Public Sans"] },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
        },
      },
    }
  </script>
  <style>
    .form-input { appearance: none; }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-content-light dark:text-content-dark">
  <div class="flex flex-col min-h-screen">
    <!-- Header -->
    <header class="border-b border-border-light dark:border-border-dark">
      <div class="container mx-auto flex items-center justify-between px-4 py-3">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 text-primary">
            <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z" fill="currentColor"></path>
            </svg>
          </div>
          <h1 class="text-xl font-bold">Kisan Sarthi</h1>
        </div>
        <nav class="hidden md:flex items-center gap-6">
          <a href="#" class="text-sm font-medium hover:text-primary transition-colors">Home</a>
          <a href="#" class="text-sm font-medium hover:text-primary transition-colors">Chatbot</a>
          <a href="#" class="text-sm font-medium hover:text-primary transition-colors">Crop Prediction</a>
          <a href="#" class="text-sm font-medium hover:text-primary transition-colors">Government Schemes</a>
        </nav>
        <div class="flex items-center gap-2">
          <a href="login.html" class="px-4 py-2 text-sm font-bold rounded-lg bg-primary/20 dark:bg-primary/30 hover:bg-primary/30 dark:hover:bg-primary/40 transition-colors">
            Login
          </a>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
      <div class="w-full max-w-md space-y-8">
        <div>
          <h2 class="mt-6 text-center text-3xl font-extrabold">Create your account</h2>
          <p class="mt-2 text-center text-sm text-subtle-light dark:text-subtle-dark">
            Already have an account?
            <a href="login.html" class="font-medium text-primary hover:text-primary/80">Sign in</a>
          </p>
        </div>

        <!-- Alert -->
        <div id="registerAlert" class="hidden rounded-lg border px-3 py-2 text-sm" role="alert"></div>

        <form id="registerForm" class="mt-8 space-y-6" method="POST" novalidate>
          <div class="rounded-lg shadow-sm -space-y-px">
            <div>
              <label class="sr-only" for="full-name">Full Name</label>
              <input id="full-name" name="full-name" type="text" required
                     placeholder="Full Name"
                     class="form-input appearance-none rounded-t-lg relative block w-full px-3 py-3 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark placeholder-subtle-light dark:placeholder-subtle-dark focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"/>
            </div>
            <div>
              <label class="sr-only" for="email-address">Email address</label>
              <input id="email-address" name="email" type="email" required autocomplete="email"
                     placeholder="Email address"
                     class="form-input appearance-none relative block w-full px-3 py-3 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark placeholder-subtle-light dark:placeholder-subtle-dark focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"/>
            </div>
            <div>
              <label class="sr-only" for="password">Password</label>
              <input id="password" name="password" type="password" required autocomplete="new-password"
                     placeholder="Password (min 6 characters)"
                     class="form-input appearance-none relative block w-full px-3 py-3 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark placeholder-subtle-light dark:placeholder-subtle-dark focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"/>
            </div>
            <div>
              <label class="sr-only" for="confirm-password">Confirm Password</label>
              <input id="confirm-password" name="confirm-password" type="password" required autocomplete="new-password"
                     placeholder="Confirm Password"
                     class="form-input appearance-none rounded-b-lg relative block w-full px-3 py-3 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark placeholder-subtle-light dark:placeholder-subtle-dark focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"/>
            </div>
          </div>

          <div id="passwordMismatch" class="flex items-center text-red-600 text-sm hidden">
            <svg class="h-5 w-5 mr-2" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
            </svg>
            <p>Passwords do not match.</p>
          </div>

          <div>
            <button id="createBtn" type="submit"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
              Create Account
            </button>
          </div>
        </form>

        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-border-light dark:border-border-dark"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-background-light dark:bg-background-dark text-subtle-light dark:text-subtle-dark">Or continue with</span>
          </div>
        </div>

        <div class="mt-6 grid grid-cols-1 gap-3">
          <button type="button" class="w-full inline-flex justify-center py-2 px-4 border border-border-light dark:border-border-dark rounded-lg shadow-sm bg-background-light dark:bg-background-dark text-sm font-medium hover:bg-primary/10 dark:hover:bg-primary/20 transition-colors">
            <img alt="Google icon" class="w-5 h-5 mr-2" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDCULWT8te03fWxRQUeP5LUZwwqkqQ5ECRtCSB7zUGemYu_rCyIjaAK0LJXIB2_nTUrgIDLg1RgyqVLhtxDZI0h-zi_W01Jw2KLuOmVg_hZLMF0ZYX0cGfwaXYKVXM37WGsndTHES7M8nxYDY1g11hhIP9zUt6LshyBCYtdLVxFQFo9GYzEuSFssGLqMLmIhSYFgCZrVrGapk00iH3yAcLm1V89TUXhPD0cBxSZEUj6wwqRkRvTAt7l0HNzCYDlFZUcWeFaT2AdQv0"/>
            Continue with Google
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    // LocalStorage keys
    const KS_USERS_KEY = 'ks_users';

    // Utils
    const getUsers = () => JSON.parse(localStorage.getItem(KS_USERS_KEY) || '[]');
    const saveUsers = (users) => localStorage.setItem(KS_USERS_KEY, JSON.stringify(users));
    const toHex = (buf) => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    async function hashPassword(pwd) {
      if (window.crypto?.subtle) {
        const data = new TextEncoder().encode(pwd);
        const digest = await crypto.subtle.digest('SHA-256', data);
        return 'sha256:' + toHex(digest);
      }
      return 'plain:' + pwd;
    }
    const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

    function showAlert(el, type, text) {
      el.classList.remove('hidden');
      el.textContent = text;
      const base = 'rounded-lg border px-3 py-2 text-sm';
      const kinds = {
        success: 'bg-green-50 text-green-800 border-green-300 dark:bg-green-900/20 dark:text-green-300 dark:border-green-800',
        error:   'bg-red-50 text-red-800 border-red-300 dark:bg-red-900/20 dark:text-red-300 dark:border-red-800',
        info:    'bg-blue-50 text-blue-800 border-blue-300 dark:bg-blue-900/20 dark:text-blue-300 dark:border-blue-800'
      };
      el.className = `${base} ${kinds[type] ?? kinds.info}`;
    }

    // Real-time password match hint
    (function attachLivePasswordMatch() {
      const pw = document.getElementById('password');
      const cpw = document.getElementById('confirm-password');
      const msg = document.getElementById('passwordMismatch');

      function check() {
        const mismatch = pw.value && cpw.value && pw.value !== cpw.value;
        msg.classList.toggle('hidden', !mismatch);
      }
      pw.addEventListener('input', check);
      cpw.addEventListener('input', check);
    })();

    // Submit registration
    (function attachRegistration() {
      const form = document.getElementById('registerForm');
      const alertEl = document.getElementById('registerAlert');
      const btn = document.getElementById('createBtn');

      // Prefill email if passed as param
      const params = new URLSearchParams(location.search);
      const prefillEmail = params.get('email');
      if (prefillEmail) {
        const el = document.getElementById('email-address');
        el.value = prefillEmail;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = (document.getElementById('full-name').value || '').trim();
        const emailRaw = (document.getElementById('email-address').value || '').trim();
        const password = document.getElementById('password').value || '';
        const confirm = document.getElementById('confirm-password').value || '';

        // Basic validations
        if (!name || !emailRaw || !password || !confirm) {
          showAlert(alertEl, 'error', 'Please fill in all fields.');
          return;
        }
        if (!isEmail(emailRaw)) {
          showAlert(alertEl, 'error', 'Please enter a valid email address.');
          return;
        }
        if (password.length < 6) {
          showAlert(alertEl, 'error', 'Password must be at least 6 characters.');
          return;
        }
        if (password !== confirm) {
          showAlert(alertEl, 'error', 'Passwords do not match.');
          return;
        }

        const email = emailRaw.toLowerCase();
        const users = getUsers();
        const exists = users.some(u => u.email === email);
        if (exists) {
          showAlert(alertEl, 'error', 'An account with this email already exists. Try logging in.');
          return;
        }

        btn.disabled = true;
        try {
          const passwordHash = await hashPassword(password);
          const newUser = {
            id: crypto.getRandomValues(new Uint32Array(1))[0] + '-' + Date.now(),
            name,
            email,
            passwordHash,
            createdAt: Date.now()
          };

          users.push(newUser);
          saveUsers(users);

          showAlert(alertEl, 'success', 'Account created! Redirecting to login...');
          // Redirect to login with success flag and prefilled email
          setTimeout(() => {
            const q = new URLSearchParams({ registered: '1', email });
            window.location.href = `login.html?${q.toString()}`;
          }, 900);
        } catch (err) {
          console.error(err);
          showAlert(alertEl, 'error', 'Something went wrong. Please try again.');
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
